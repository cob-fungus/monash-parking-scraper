name: Scrape Monash Parking Data

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes
  workflow_dispatch:       # Allows manually running the script from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run scraper script
      run: python scraper.py

    - name: Commit and push updated CSV
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add monash_all_parking_availabilities.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update parking data [skip ci]" && git push)
